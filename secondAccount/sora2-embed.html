<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SoraScore Provider</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .playerContainer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #provider-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Brand overlay — exactly matches ProviderIframePlayer.module.css */
    .brandOverlay {
      position: absolute;
      top: 12px;
      right: 7px;
      pointer-events: none;
      z-index: 5;
    }

    .brandBar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 24px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      width: 100px;
    }

    .brandLogo {
      width: 14px;
      height: 14px;
      object-fit: contain;
      display: block;
    }

    .brandText {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      line-height: 1;
    }

    /* loading / error states */
    #spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.08);
      border-top-color: #ccff00;
      display: none;
      animation: spin 0.85s linear infinite;
    }

    #spinner.show {
      display: block;
    }

    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    #err {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #000;
      color: #f87171;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    #err.show {
      display: flex;
    }

    /* Static Share Button (Top Left) */
    #topShareBtn {
      position: absolute;
      top: 15px;
      left: 15px;
      height: 40px;
      background: rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 16px 0 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
      z-index: 20;
    }

    #topShareBtn:hover {
      background: rgba(40, 40, 40, 0.8);
      border-color: #ccff00;
    }

    #topShareBtn .share-text {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.5px;
      color: #ccff00;
    }
  </style>
</head>

<body>
  <div class="playerContainer">
    <iframe id="provider-frame" sandbox="allow-scripts allow-same-origin" allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen></iframe>

    <div id="spinner" class="show"></div>
    <div id="err">
      <div id="errMsg">Channel unavailable</div>
    </div>

    <div class="brandOverlay">
      <div class="brandBar">
        <img src="logo.png" alt="" class="brandLogo" />
        <span class="brandText">SoraScore</span>
      </div>
    </div>

    <!-- STATIC TOP-LEFT BUTTON -->
    <button id="topShareBtn" aria-label="Copy Embed Code">
      <span class="share-text">&lt;&gt; Copy Embed</span>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      var frame = document.getElementById('provider-frame');
      var spin = document.getElementById('spinner');
      var err = document.getElementById('err');
      var errM = document.getElementById('errMsg');

      var PUBLIC_API = 'https://sorapublic.sorascorebackend.workers.dev';

      // ─── Sandbox: blocks popups & top-navigation (ads), allows scripts + media ─
      var SANDBOX = 'allow-scripts allow-same-origin allow-forms allow-presentation';

      // ─── Security guard ────────────────────────────────────────────────────────
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      // ─── Get slug from query param ─────────────────────────────────────────────
      function getSlug() {
        var p = new URLSearchParams(window.location.search);
        return (p.get('ch') || '').replace(/[^a-zA-Z0-9_-]/g, '').trim();
      }

      // ─── Show / hide helpers ──────────────────────────────────────────────────
      function showSpin(v) { spin.classList.toggle('show', v); }
      function showErr(msg) { errM.textContent = msg; err.classList.add('show'); showSpin(false); }

      // ─── Init ─────────────────────────────────────────────────────────────────
      async function init() {
        var slug = getSlug();
        if (!slug) {
          showErr('No channel. Add ?ch=slug');
          return;
        }

        try {
          var res = await fetch(PUBLIC_API + '/api/public/provider/' + slug + '?provider=sora2-embed');
          if (!res.ok) throw new Error('API error');
          var data = await res.json();
          if (!data || !data.embed_url) throw new Error('No stream found');

          frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
          frame.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write');

          frame.src = data.embed_url;
          frame.addEventListener('load', function () {
            showSpin(false);
          });

          setTimeout(function () {
            if (spin.classList.contains('show')) {
              showErr('Channel took too long to load.');
            }
          }, 15000);
        } catch (err) {
          showErr('Stream offline');
          console.error(err);
        }
      }

      // ─── Share / Copy Embed ───────────────────────────────────────────────────
      var topShareBtn = document.getElementById('topShareBtn');
      var shareText = topShareBtn.querySelector('.share-text');
      
      topShareBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        var ch = getSlug();
        if (ch) {
          var iframeCode = '<iframe src="https://emebedplayersora.pages.dev/sora2-embed?ch=' + ch + '" width="100%" height="100%" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen></iframe>';
          navigator.clipboard.writeText(iframeCode).then(function() {
            var oldLabel = shareText.textContent;
            shareText.textContent = 'Copied!';
            shareText.style.color = '#ccff00';
            setTimeout(function() {
              shareText.textContent = oldLabel;
              shareText.style.color = '#fff';
            }, 2000);
          });
        }
      });

      window.addEventListener('message', function (e) {
        if (e.data === 'FORCE_REFRESH') {
          showSpin(true);
          err.classList.remove('show');
          if (frame.src) frame.src = frame.src;
        }
      });

      // ─── Auto-Landscape on Fullscreen ─────────────────────────────────────────
      ['fullscreenchange', 'webkitfullscreenchange'].forEach(function(evt) {
        document.addEventListener(evt, async function() {
          var isFull = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFull) {
            if (screen.orientation && screen.orientation.lock) {
              try { await screen.orientation.lock('landscape'); } catch (e) {}
            }
          } else {
            if (screen.orientation && screen.orientation.unlock) {
              try { screen.orientation.unlock(); } catch (e) {}
            }
          }
        });
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    }());
  </script>
</body>

</html>
